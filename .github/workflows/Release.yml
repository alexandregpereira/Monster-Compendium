name: Multiplatform Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  MONSTER_COMPENDIUM_KEYSTORE_PASSWORD: ${{ secrets.MONSTER_COMPENDIUM_KEYSTORE_PASSWORD }}
  AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
  AMPLITUDE_SANDBOX_API_KEY: ${{ secrets.AMPLITUDE_SANDBOX_API_KEY }}
  REVENUE_CAT_ANDROID_API_KEY: ${{ secrets.REVENUE_CAT_ANDROID_API_KEY }}
  REVENUE_CAT_IOS_API_KEY: ${{ secrets.REVENUE_CAT_IOS_API_KEY }}
  REVENUE_CAT_SANDBOX_API_KEY: ${{ secrets.REVENUE_CAT_SANDBOX_API_KEY }}

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2.5.0

      - uses: ./.github/actions/setup-gradle

      - name: Build with Gradle
        run: ./gradlew bundleRelease

      - name: Verify database migration
        run: chmod +x ./scripts/sqldelight/verifyDatabaseMigration && ./scripts/sqldelight/verifyDatabaseMigration

      - uses: ./.github/actions/upload-test-report

      - name: Encrypt AAB
        env:
          RELEASE_ARTIFACT_PASSPHRASE: ${{ secrets.RELEASE_ARTIFACT_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in app-android/build/outputs/bundle/release/app-android-release.aab \
            -out $RUNNER_TEMP/app-android-release.aab.enc \
            -pass env:RELEASE_ARTIFACT_PASSPHRASE

      - name: Upload encrypted AAB
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-release
          path: ${{ runner.temp }}/app-android-release.aab.enc
          retention-days: 1
          if-no-files-found: error

  ios-build:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2.5.0

      - uses: ./.github/actions/setup-gradle

      - uses: ./.github/actions/setup-ios

      - name: Update iOS version in xcconfig
        run: ./gradlew :app:updateIosVersion

      - name: Import signing certificate
        env:
          APPLE_BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          APPLE_BUILD_P12_PASSWORD: ${{ secrets.APPLE_BUILD_P12_PASSWORD }}
          APPLE_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$APPLE_BUILD_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$APPLE_BUILD_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_BUILD_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_BUILD_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profile
        env:
          APPLE_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$APPLE_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Archive iOS app
        working-directory: iosApp
        run: |
          xcodebuild archive \
            -workspace MonsterCompendium.xcworkspace \
            -scheme MonsterCompendium \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ github.workspace }}/MonsterCompendium.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.APPLE_BUILD_PROVISION_PROFILE_NAME }}"

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>UF66T7J8P8</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>br.alexandregpereira.MonsterCompendium</key>
              <string>${{ secrets.APPLE_BUILD_PROVISION_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath ${{ github.workspace }}/MonsterCompendium.xcarchive \
            -exportPath ${{ github.workspace }}/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Encrypt IPA
        env:
          RELEASE_ARTIFACT_PASSPHRASE: ${{ secrets.RELEASE_ARTIFACT_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in ${{ github.workspace }}/export/MonsterCompendium.ipa \
            -out $RUNNER_TEMP/MonsterCompendium.ipa.enc \
            -pass env:RELEASE_ARTIFACT_PASSPHRASE

      - name: Upload encrypted IPA
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ios-release
          path: ${{ runner.temp }}/MonsterCompendium.ipa.enc
          retention-days: 1
          if-no-files-found: error

  # Publishing only starts once both builds succeed, so a failing build never leaves
  # one store with a version the other does not have. iOS goes first because its
  # upload is the one more likely to be rejected.
  ios-publish:
    name: iOS Publish
    needs: [android-build, ios-build]
    runs-on: macos-latest
    steps:
      - name: Download encrypted IPA
        uses: actions/download-artifact@v4.3.0
        with:
          name: ios-release
          path: ${{ runner.temp }}

      - name: Decrypt IPA
        env:
          RELEASE_ARTIFACT_PASSPHRASE: ${{ secrets.RELEASE_ARTIFACT_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in $RUNNER_TEMP/MonsterCompendium.ipa.enc \
            -out $RUNNER_TEMP/MonsterCompendium.ipa \
            -pass env:RELEASE_ARTIFACT_PASSPHRASE

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
          xcrun altool --upload-app \
            --type ios \
            --file $RUNNER_TEMP/MonsterCompendium.ipa \
            --apiKey $APP_STORE_CONNECT_API_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_API_ISSUER_ID

  android-publish:
    name: Android Publish
    needs: [ios-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted AAB
        uses: actions/download-artifact@v4.3.0
        with:
          name: android-release
          path: ${{ runner.temp }}

      - name: Decrypt AAB
        env:
          RELEASE_ARTIFACT_PASSPHRASE: ${{ secrets.RELEASE_ARTIFACT_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in $RUNNER_TEMP/app-android-release.aab.enc \
            -out $RUNNER_TEMP/app-android-release.aab \
            -pass env:RELEASE_ARTIFACT_PASSPHRASE

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.alexandregpereira.hunter.app
          releaseFiles: ${{ runner.temp }}/app-android-release.aab
          tracks: internal

  cleanup-artifacts:
    name: Delete Release Artifacts
    needs: [android-publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete encrypted builds
        uses: geekyeggo/delete-artifact@v5.1.0
        with:
          name: |
            android-release
            ios-release
          failOnError: false
